version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sowberry-frontend
    restart: unless-stopped
    ports:
      - "10014:80"
    depends_on:
      - backend

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: sowberry-backend
    restart: unless-stopped
    ports:
      - "10015:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - DB_NAME=sowberry
      - JWT_SECRET=change_this_secret_in_production
      # CLIENT_URL is used for CORS. Since Nginx proxies, it comes from same origin effectively, 
      # but we might still need it if backend checks Referer/Origin strictly.
      # Setting to * or specific domain is good.
      - CLIENT_URL=*
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: sowberry-db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=sowberry
    volumes:
      - mysql_data:/var/lib/mysql
    # Setup for compatibility (optional but recommended)
    command: --default-authentication-plugin=mysql_native_password

volumes:
  mysql_data:
